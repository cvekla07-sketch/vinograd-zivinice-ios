# XcodeGen opis Xcode projekta.
# Xcode projekat (iosApp.xcodeproj) se generiše automatski na GitHub Actions — ne čuva se u repozitoriju.
name: iosApp
options:
  bundleIdPrefix: com.vinograd
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "4.4"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.2
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
    scheme: {}
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: iosApp/iosApp.entitlements
      properties:
        aps-environment: development
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Vinograd Živinice
        CFBundleDevelopmentRegion: bs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes:
          - remote-notification
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vinograd.zivinice
        PRODUCT_NAME: VinogradZivinice
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../composeApp/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - "ComposeApp"
    preBuildScripts:
      - name: Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
